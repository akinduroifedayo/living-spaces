screenshots: []
# plugin.yaml declares no host capabilities (capabilities: []).
# The catalog schema below summarizes registrations, not host permissions.
# Desktop surface: desktop/plugin.js; /spaces route, Spaces sidebar, living-space card.
capabilities:
  provides_tools:
    - spaces_list
    - spaces_get
    - spaces_create
    - spaces_read_file
    - spaces_write_files
    - spaces_edit_file
    - spaces_query
    - spaces_write_records
    - spaces_read_logs
    - spaces_revisions
    - spaces_restore
    - spaces_refresh
    - spaces_schedule_upkeep
    - spaces_upkeep
  provides_hooks: []
  provides_middleware: []
  requires_env: []
